<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .code {
            font-size: 32px;
            color: #007bff;
            margin: 20px 0;
        }
        .note {
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">전남대학교 사물함 신청 서비스</div>
    <p>인증 번호는 <span class="code" th:text="${code}"></span>입니다.</p>
    <p class="note">이 인증 번호는 발급 후 5분 동안 유효합니다.</p>
    <p>감사합니다.</p>
</div>
</body>
</html>
