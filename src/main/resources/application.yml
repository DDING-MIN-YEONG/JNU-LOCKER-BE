spring:
  application:
    name: jnu-locker

  datasource:
    url: jdbc:postgresql://${PGVECTOR_HOST}:${PGVECTOR_PORT}/${PGVECTOR_DATABASE}
    username: ${PGVECTOR_USERNAME}
    password: ${PGVECTOR_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: locker
        jdbc:
          batch_size: 50 # 한 번에 50개의 SQL 문을 배치로 실행
        order_inserts: true # Action Queue 내부 insert 문을 정렬하여 실행
        order_updates: true # Action Queue 내부 update 문을 정렬하여 실행
    defer-datasource-initialization: true

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          timeout: 5000
          starttls:
            enable: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL}
    vectorstore:
      pgvector:
        table-name: ${PGVECTOR_TABLE_NAME}
        initialize-schema: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      base-path: ${MANAGEMENT_BASE_PATH}
      exposure:
        include:
          - health
          - prometheus
    access:
      default: none
  endpoint:
    health:
      access: unrestricted
    prometheus:
      access: unrestricted

logging:
  level:
    root: ${LOGGING_LEVEL}  # TRACE < DEBUG < INFO < WARN < ERROR < FATAL < OFF

  file:
    name: ${LOGGING_DIR}/${LOGGING_FILE}

  logback:
    rollingpolicy:
      max-history: 30       # default: 7
      max-file-size: 10MB   # default: 10MB
      total-size-cap: 5GB   # default: 제한 없음
      file-name-pattern: ${LOGGING_DIR}/${LOGGING_FILE_NAME_PATTERN} # 압축해서 보관 -> 디스크 절약

springdoc:
  api-docs:
    path: /api-docs # default: /v3/api-docs

# p6spy 로깅 활성화 (JDBC 이벤트 로깅)
decorator:
  datasource:
    p6spy:
      enable-logging: true

custom:
  email-verification:
    fixed: ${EMAIL_VERIFICATION_FIXED}
    code: ${EMAIL_VERIFICATION_CODE}
  jwt:
    access-secret-key: ${JWT_ACCESS_SECRET_KEY}
    refresh-secret-key: ${JWT_REFRESH_SECRET_KEY}
    access-token-expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME}
    refresh-token-expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME}
  lock:
    watchdog:
      timeout: ${LOCK_WATCHDOG_TIMEOUT:30000} # Watchdog 타임아웃 (밀리초, 기본: 30초)

email:
  sender: ${EMAIL_SENDER}

---
spring:
  config:
    activate:
      on-profile: local

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT}

  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: dev

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT}

  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate

---
spring:
  config:
    activate:
      on-profile: prod

  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: ${REDIS_PORT}

  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: validate

# 프로덕션 환경에서는 p6spy 로깅을 비활성화
decorator:
  datasource:
    p6spy:
      enable-logging: false
