services:
  pgvector:
    image: pgvector/pgvector:pg18
    container_name: pgvector-jnu-locker
    environment:
      TZ: Asia/Seoul
      LC_ALL: C.UTF-8
      POSTGRES_USER: ${PGVECTOR_USERNAME}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD}
      POSTGRES_DB: ${PGVECTOR_DATABASE}
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $PGVECTOR_USERNAME" ]
      start_period: 20s
      start_interval: 3s
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    networks:
      - jnu-locker-network

  redis:
    container_name: redis-jnu-locker
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: /bin/sh -c "redis-server --requirepass $REDIS_PASSWORD"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      start_period: 10s
      start_interval: 3s
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jnu-locker-network

  was:
    container_name: was-jnu-locker
    image: ${DOCKER_USERNAME}/${DOCKER_REPO}:${IMAGE_TAG}
    ports:
      - "8080:8080"
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080$MANAGEMENT_BASE_PATH/health || exit 1" ]
      start_period: 70s
      start_interval: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ${WAS_LOG_PATH}:${LOGGING_DIR}
    networks:
      - jnu-locker-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-jnu-locker
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - jnu-locker-network

  prometheus:
    # user: root # 최초 실행시에만 하기 (컨테이너 접속 후 /data 경로 nobody 권한 주는 용도)
    container_name: prometheus-jnu-locker
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/data
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/data' # 기본값이 /data
      - '--storage.tsdb.retention.time=30d' # 데이터 보존 기간 설정 (1년: 1y or 365d)
      - '--storage.tsdb.retention.size=3GB' # 데이터 보존 용량 설정
      - '--web.enable-lifecycle' # reload 기능 활성화
    depends_on:
      was:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9090/metrics" ]
      start_period: 20s
      start_interval: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - jnu-locker-network

  grafana:
    container_name: grafana-jnu-locker
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://api.dev.jnu-locker.site/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health" ]
      start_period: 20s
      start_interval: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - jnu-locker-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-jnu-locker
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/log:/home/jnu-locker/log
    environment:
      TZ: Asia/Seoul
    networks:
      - jnu-locker-network
    depends_on:
      was:
        condition: service_healthy
      grafana:
        condition: service_healthy

networks:
  jnu-locker-network:
    driver: bridge

volumes:
  grafana-data:
    external: true
  prometheus-data:
    external: true
  elasticsearch-data:
    external: true
  pgvector-data:
    external: true
